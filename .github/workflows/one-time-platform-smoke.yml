name: LittleAPI v1.4 Smoke Test

on:
  push:
    paths:
      - ".github/workflows/one-time-platform-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test public query and response headers
        run: |
          curl --fail-with-body --silent --show-error --get \
            -D headers.txt \
            "https://littleapi.online/api/v1/4gCDjwJ3DrqFcOcI_g2t/query" \
            --data-urlencode "q=SELECT Name LIMIT 2" \
            -o result.json
          grep -i "x-littleapi-version: 1.4.0" headers.txt
          grep -i "x-littleapi-request-id:" headers.txt
          python - <<'PY'
          import json
          data=json.load(open('result.json',encoding='utf-8'))
          assert isinstance(data.get('data'),list), data
          assert len(data['data']) <= 2, data
          print('PASS', data.get('meta',{}).get('translated_query'))
          PY
