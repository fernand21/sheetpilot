name: LittleAPI Public Query Docs Upgrade

on:
  push:
    paths:
      - ".github/workflows/one-time-query-docs.yml"

permissions:
  contents: write

jobs:
  upgrade-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public query documentation
        run: python scripts/upgrade-query-docs.py
      - name: Commit documentation
        run: |
          git config user.name "LittleAPI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --check
          git commit -m "Document public advanced query API"
          git push
