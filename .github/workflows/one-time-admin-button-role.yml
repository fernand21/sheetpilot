name: LittleAPI Admin Button Role Fix

on:
  push:
    paths:
      - ".github/workflows/one-time-admin-button-role.yml"
      - "scripts/patch_admin_button_direct_role.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply admin button role patch
        run: python scripts/patch_admin_button_direct_role.py
      - name: Verify JavaScript
        run: |
          node --check app-enhancements.js
          grep -q 'littleapi_admin_users' app-enhancements.js
          grep -q '⚙ Admin' app-enhancements.js
      - name: Commit patch
        run: |
          git config user.name "fernand21"
          git config user.email "farevalo210@gmail.com"
          git add app-enhancements.js
          git commit -m "Show admin button from secure self role lookup"
          git push
