name: LittleAPI Project JWT Retry

on:
  push:
    paths:
      - ".github/workflows/one-time-project-jwt-retry.yml"
      - "scripts/patch_project_jwt_retry.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply project JWT retry patch
        run: python scripts/patch_project_jwt_retry.py
      - name: Verify JavaScript
        run: |
          node --check app.js
          grep -q 'isTransientJwtError' app.js
          grep -q 'async function projects(retryAuth = true)' app.js
      - name: Commit patch
        run: |
          git config user.name "fernand21"
          git config user.email "farevalo210@gmail.com"
          git add app.js
          git commit -m "Retry initial project load after transient JWT skew"
          git push
