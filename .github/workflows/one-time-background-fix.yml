name: LittleAPI Background Task Fix

on:
  push:
    paths:
      - ".github/workflows/one-time-background-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch waitUntil usage
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/sheetpilot-api/platform.ts')
          s=p.read_text(encoding='utf-8')
          old='''function background(task: Promise<unknown>) {\n  const safe = task.catch((error) => console.error("LittleAPI background task failed", error));\n  const runtime = (globalThis as any).EdgeRuntime;\n  if (runtime?.waitUntil) runtime.waitUntil(safe);\n}'''
          new='''function background(task: Promise<unknown>) {\n  const safe = task.catch((error) => console.error("LittleAPI background task failed", error));\n  try {\n    // Supabase exposes EdgeRuntime as a runtime global; waitUntil keeps the isolate alive after the HTTP response.\n    // @ts-ignore Supabase Edge Runtime global\n    EdgeRuntime.waitUntil(safe);\n  } catch (_) {\n    safe.catch(() => {});\n  }\n}'''
          if old not in s:
              raise SystemExit('Expected background function not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "fernand21"
          git config user.email "farevalo210@gmail.com"
          git add supabase/functions/sheetpilot-api/platform.ts
          git commit -m "Fix Supabase background telemetry tasks"
          git push
