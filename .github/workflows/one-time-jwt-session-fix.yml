name: LittleAPI JWT Session Fix

on:
  push:
    paths:
      - ".github/workflows/one-time-jwt-session-fix.yml"
      - "scripts/patch_jwt_session.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply JWT session patch
        run: python scripts/patch_jwt_session.py
      - name: Verify JavaScript
        run: |
          node --check app.js
          node --check app-enhancements.js
          grep -q 'const sameUser = user?.id === session.user.id' app.js
          grep -q 'adminEntryFailures' app-enhancements.js
      - name: Commit patch
        run: |
          git config user.name "fernand21"
          git config user.email "farevalo210@gmail.com"
          git add app.js app-enhancements.js
          git commit -m "Fix transient JWT refresh and preserve admin access"
          git push
