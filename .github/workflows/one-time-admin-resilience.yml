name: LittleAPI Admin Entry Resilience

on:
  push:
    paths:
      - ".github/workflows/one-time-admin-resilience.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep admin entry after dashboard re-render
        shell: python
        run: |
          from pathlib import Path
          p = Path('app-enhancements.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ('let adminEntryChecked = false;', 'let adminEntryDenied = false;'),
            ('if (!actions || $("#admin-console-link", actions) || adminEntryChecking || adminEntryChecked) return;', 'if (!actions || $("#admin-console-link", actions) || adminEntryChecking || adminEntryDenied) return;'),
            ('if (response.status === 401 || response.status === 403) adminEntryChecked = true;', 'if (response.status === 401 || response.status === 403) adminEntryDenied = true;'),
            ('      refreshAdminEntryLanguage();\n      adminEntryChecked = true;', '      refreshAdminEntryLanguage();')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Patch target not found: ' + old)
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Verify JavaScript
        run: |
          node --check app-enhancements.js
          grep -q 'adminEntryDenied' app-enhancements.js
          ! grep -q 'adminEntryChecked' app-enhancements.js
      - name: Commit patch
        run: |
          git config user.name "fernand21"
          git config user.email "farevalo210@gmail.com"
          git add app-enhancements.js
          git commit -m "Keep admin entry visible after dashboard refresh"
          git push
