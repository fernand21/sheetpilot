name: LittleAPI MCP Upgrade

on:
  push:
    paths:
      - ".github/workflows/one-time-mcp-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align MCP authorization with REST
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/sheetpilot-api/index.ts')
          s=p.read_text(encoding='utf-8')
          old='''function operationNeedsApiKey(api: ApiRecord, path: string[], method: string) {\n  if (path[1] === "query" && (method === "GET" || method === "POST")) return api.public_read !== true;'''
          new='''function operationNeedsApiKey(api: ApiRecord, path: string[], method: string) {\n  if (path[1] === "mcp") return false;\n  if (path[1] === "query" && (method === "GET" || method === "POST")) return api.public_read !== true;'''
          if old not in s:
              raise SystemExit('operationNeedsApiKey marker not found')
          s=s.replace(old,new)
          s=s.replace('if (path[1] === "mcp") return handleMcp(request, api);','if (path[1] === "mcp") return handleMcp(request, api, await hasApiKey(api, request));')
          p.write_text(s,encoding='utf-8')

          p=Path('supabase/functions/sheetpilot-api/mcp.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('export async function handleMcp(request: Request, api: { api_id: string; name: string; resource_type: ResourceType }) {','export async function handleMcp(request: Request, api: { api_id: string; name: string; resource_type: ResourceType; public_read: boolean }, authorized = false) {')
          old='''    if (!toolName) return rpcError(payload.id, -32602, "params.name is required.");\n    if (!toolList(api.resource_type).some(tool => tool.name === toolName)) return rpcError(payload.id, -32602, `Unknown tool: ${toolName}`);\n    try {'''
          new='''    if (!toolName) return rpcError(payload.id, -32602, "params.name is required.");\n    const tool = toolList(api.resource_type).find(candidate => candidate.name === toolName);\n    if (!tool) return rpcError(payload.id, -32602, `Unknown tool: ${toolName}`);\n    const publicReadAllowed = api.resource_type === "sheet" && api.public_read === true && tool.annotations?.readOnlyHint === true;\n    if (!authorized && !publicReadAllowed) {\n      return mcpResponse({ jsonrpc: "2.0", id: payload.id ?? null, error: { code: -32001, message: "This MCP tool requires the LittleAPI API key. Send X-API-Key or Authorization: Bearer <your apikey>." } }, 401, { "WWW-Authenticate": 'Bearer realm="LittleAPI"' });\n    }\n    try {'''
          if old not in s:
              raise SystemExit('tools/call auth marker not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Commit authorization update
        run: |
          git config user.name "fernand21"
          git config user.email "farevalo210@gmail.com"
          git add supabase/functions/sheetpilot-api/index.ts supabase/functions/sheetpilot-api/mcp.ts
          git commit -m "Allow MCP reads for public LittleAPI sheets"
          git push
