<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b766e">
  <title>LittleApp</title>
  <link rel="icon" href="littleapi-icon.svg">
  <style>
    :root{--accent:#0b766e;--bg:#f6f9f8;--panel:#fff;--line:#dbe7e3;--text:#17312b;--muted:#6d817b;--nav:#10231f;--navtext:#e5f3ef}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}
    body.dark{--bg:#0b1513;--panel:#111d1a;--line:#263b35;--text:#eef7f4;--muted:#91a8a1;--nav:#07100e;--navtext:#e9f6f2}
    .app-shell{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}.nav{background:var(--nav);color:var(--navtext);padding:28px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px}.brand img{width:34px;height:34px}.brand strong{display:block;font-size:1.05rem}.brand small{display:block;margin-top:2px;color:#94b0a7}.nav-item{padding:11px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 28%,transparent);font-size:.85rem;font-weight:850}.nav-foot{margin-top:auto;color:#78968d;font-size:.72rem}.nav-foot a{color:inherit}
    .main{min-width:0}.topbar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px clamp(18px,4vw,44px);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}.topbar h1{margin:0;font-size:1.15rem}.top-actions{display:flex;align-items:center;gap:8px}.top-actions select,.install{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel);color:var(--text)}.install{cursor:pointer;font-weight:800}
    .content{padding:clamp(22px,4vw,48px);max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.hero h2{margin:0;font-size:clamp(1.8rem,4vw,3.3rem);line-height:1}.hero p{margin:8px 0 0;color:var(--muted);max-width:720px}.count{color:var(--muted);font-size:.8rem;font-weight:800}
    .search{margin:0 0 20px;position:relative}.search input{width:100%;padding:13px 15px 13px 43px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);outline:none}.search:before{content:"⌕";position:absolute;left:16px;top:9px;font-size:1.25rem;color:var(--muted)}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}.card,.list-row{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:17px;cursor:pointer;transition:.16s}.card:hover,.list-row:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 12px 35px rgba(20,60,52,.08)}.card h3,.list-row h3{margin:0 0 11px;font-size:1rem}.kv{display:grid;grid-template-columns:minmax(72px,.42fr) 1fr;gap:7px 10px;padding:4px 0;font-size:.78rem}.kv span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kv b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .list{display:grid;gap:7px}.list-row{display:grid;grid-template-columns:minmax(160px,.8fr) 1fr;align-items:center}.list-row h3{margin:0}.list-meta{display:flex;gap:14px;min-width:0}.list-meta span{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:color-mix(in srgb,var(--panel) 92%,var(--accent) 8%)}tbody tr{cursor:pointer}tbody tr:hover{background:color-mix(in srgb,var(--panel) 92%,var(--accent) 8%)}
    .pager{display:flex;justify-content:center;align-items:center;gap:9px;margin-top:22px}.pager button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:default}.pager span{font-size:.8rem;color:var(--muted);min-width:110px;text-align:center}
    .empty,.error{padding:34px;border:1px dashed var(--line);border-radius:15px;color:var(--muted);text-align:center;background:var(--panel)}.error{color:#b44b43;border-color:#e7b3ae}
    dialog{width:min(720px,calc(100% - 28px));border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0;box-shadow:0 28px 100px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(5,20,16,.52)}.detail-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.detail-head h2{margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:1.7rem;cursor:pointer}.detail-body{padding:18px 24px 26px}.detail-row{display:grid;grid-template-columns:170px 1fr;gap:15px;padding:11px 0;border-bottom:1px solid var(--line)}.detail-row span{color:var(--muted);font-size:.8rem}.detail-row strong{word-break:break-word}
    .top-layout .app-shell{display:block}.top-layout .nav{position:sticky;top:0;height:auto;z-index:20;display:flex;flex-direction:row;align-items:center;padding:11px clamp(18px,4vw,44px)}.top-layout .nav-item{margin-left:auto}.top-layout .nav-foot{display:none}.top-layout .topbar{top:62px}.bottom-layout .app-shell{display:flex;flex-direction:column}.bottom-layout .nav{order:2;position:fixed;left:0;right:0;bottom:0;top:auto;height:68px;z-index:20;display:flex;flex-direction:row;align-items:center;padding:8px 16px}.bottom-layout .brand small,.bottom-layout .nav-foot{display:none}.bottom-layout .nav-item{margin-left:auto}.bottom-layout .main{padding-bottom:72px}
    @media(max-width:760px){.app-shell{display:block}.nav{height:auto;position:sticky;z-index:20;display:flex;flex-direction:row;align-items:center;padding:10px 14px}.nav-item{margin-left:auto}.nav-foot{display:none}.brand small{display:none}.topbar{top:58px;padding:11px 14px}.content{padding:22px 14px 40px}.hero{align-items:flex-start;flex-direction:column}.list-row{grid-template-columns:1fr}.detail-row{grid-template-columns:1fr;gap:5px}.top-actions .install{display:none}}
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="nav">
    <div class="brand"><img src="littleapi-icon.svg" alt=""><div><strong id="nav-name">LittleApp</strong><small id="nav-subtitle"></small></div></div>
    <div class="nav-item" id="nav-data">▦ Data</div>
    <div class="nav-foot">Powered by <a href="https://littleapi.online" target="_blank" rel="noreferrer">LittleAPI</a></div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="top-name">LittleApp</h1><div class="top-actions"><button class="install hidden" id="install">Install</button><select id="language"><option value="en">English</option><option value="es">Español</option></select></div></header>
    <section class="content">
      <div class="hero"><div><h2 id="title">LittleApp</h2><p id="subtitle"></p></div><div class="count" id="count"></div></div>
      <label class="search hidden" id="search-wrap"><input id="search" autocomplete="off" placeholder="Search"></label>
      <div id="results"></div>
      <div class="pager hidden" id="pager"><button id="prev">←</button><span id="page-label"></span><button id="next">→</button></div>
    </section>
  </main>
</div>
<dialog id="detail"><div class="detail-head"><h2 id="detail-title">Detail</h2><button class="close" id="close">×</button></div><div class="detail-body" id="detail-body"></div></dialog>
<script src="config.js?v=20260917-7"></script>
<script>
(() => {
  const cfg=window.SUPABASE_CONFIG||{}, params=new URLSearchParams(location.search), slug=params.get("app")||"";
  const $=s=>document.querySelector(s), esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const lang=()=>localStorage.getItem("littleapi:language")==="es"?"es":((navigator.language||"en").toLowerCase().startsWith("es")?"es":"en");
  const words={en:{data:"Data",search:"Search records…",install:"Install",detail:"Details",empty:"No records found.",error:"This app could not be loaded.",page:"Page {p}",records:"{n} records",prev:"Previous",next:"Next"},es:{data:"Datos",search:"Buscar registros…",install:"Instalar",detail:"Detalles",empty:"No se encontraron registros.",error:"No se pudo cargar esta aplicación.",page:"Página {p}",records:"{n} registros",prev:"Anterior",next:"Siguiente"}};
  const t=k=>(words[lang()]||words.en)[k]||k;
  let app=null,state={page:0,rows:[],total:0,hasMore:false,search:""},deferredInstall=null,timer=null;
  function visible(){return (app?.config?.fields||[]).filter(f=>f.visible!==false)}
  function accentColor(name){return{teal:"#0b766e",purple:"#6558e8",blue:"#2f6fed",orange:"#e47b28",rose:"#d94f70"}[name]||"#0b766e"}
  function applyLanguage(){document.documentElement.lang=lang();$("#language").value=lang();$("#nav-data").textContent="▦ "+t("data");$("#search").placeholder=t("search");$("#install").textContent=t("install");$("#detail-title").textContent=t("detail");render()}
  function setup(){
    const c=app.config||{};document.title=(c.name||app.name)+" — LittleApp";const accent=accentColor(c.accent);document.documentElement.style.setProperty("--accent",accent);document.querySelector('meta[name="theme-color"]').content=accent;
    const theme=c.theme||"light";if(theme==="dark"||(theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.body.classList.add("dark");
    if(c.navigation==="top")document.body.classList.add("top-layout");if(c.navigation==="bottom")document.body.classList.add("bottom-layout");
    const title=c.name||app.name;$("#nav-name").textContent=title;$("#top-name").textContent=title;$("#title").textContent=title;$("#nav-subtitle").textContent=c.subtitle||app.sheet||"";$("#subtitle").textContent=c.subtitle||app.sheet||"";
    $("#search-wrap").classList.toggle("hidden",c.search===false);
    const manifest=document.createElement("link");manifest.rel="manifest";manifest.href=(cfg.apiBase||"https://littleapi.online/api/v1")+"/apps/"+encodeURIComponent(app.slug)+"/manifest.webmanifest";document.head.appendChild(manifest);
  }
  function apiUrl(){
    const c=app.config||{},fields=visible().map(f=>f.name).join(","),limit=Math.max(1,Math.min(100,Number(c.pageSize||25))),offset=state.page*limit;
    let url=(cfg.apiBase||"https://littleapi.online/api/v1")+"/"+encodeURIComponent(app.api_id)+(state.search?"/search":"");
    const q=new URLSearchParams({sheet:app.sheet||"",limit:String(limit),offset:String(offset)});if(fields)q.set("select",fields);if(state.search)q.set("search",state.search);return url+"?"+q.toString();
  }
  async function load(){
    $("#results").innerHTML='<div class="empty">…</div>';const r=await fetch(apiUrl()),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||data.error||"api_error");state.rows=Array.isArray(data.data)?data.data:[];state.total=Number(data.total||state.rows.length);state.hasMore=Boolean(data.has_more);render();
  }
  function primary(row){const f=visible()[0];return f?row[f.name]:"Record"}
  function render(){
    if(!app)return;const rows=state.rows,fields=visible(),root=$("#results"),view=app.config?.view||"cards";$("#count").textContent=t("records").replace("{n}",String(state.total));
    if(!rows.length){root.innerHTML='<div class="empty">'+esc(t("empty"))+'</div>'}else if(view==="table"){root.innerHTML='<div class="table-wrap"><table><thead><tr>'+fields.map(f=>"<th>"+esc(f.label||f.name)+"</th>").join("")+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr data-row="'+i+'">'+fields.map(f=>"<td>"+esc(r[f.name])+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"}
    else if(view==="list"){root.innerHTML='<div class="list">'+rows.map((r,i)=>'<article class="list-row" data-row="'+i+'><h3>'+esc(primary(r))+'</h3><div class="list-meta">'+fields.slice(1,4).map(f=>"<span>"+esc(f.label||f.name)+": "+esc(r[f.name])+"</span>").join("")+"</div></article>").join("")+"</div>"}
    else{root.innerHTML='<div class="cards">'+rows.map((r,i)=>'<article class="card" data-row="'+i+'><h3>'+esc(primary(r))+'</h3>'+fields.slice(1,5).map(f=>'<div class="kv"><span>'+esc(f.label||f.name)+'</span><b>'+esc(r[f.name])+'</b></div>').join("")+"</article>").join("")+"</div>"}
    root.querySelectorAll("[data-row]").forEach(n=>n.onclick=()=>showDetail(rows[Number(n.dataset.row)]));
    const limit=Math.max(1,Number(app.config?.pageSize||25)),page=state.page+1;$("#pager").classList.toggle("hidden",state.total<=limit&&state.page===0);$("#page-label").textContent=t("page").replace("{p}",String(page));$("#prev").textContent="← "+t("prev");$("#next").textContent=t("next")+" →";$("#prev").disabled=state.page===0;$("#next").disabled=!state.hasMore;
  }
  function showDetail(row){if(app.config?.detail===false)return;const fields=visible();$("#detail-body").innerHTML=fields.map(f=>'<div class="detail-row"><span>'+esc(f.label||f.name)+'</span><strong>'+esc(row[f.name])+'</strong></div>').join("");$("#detail").showModal()}
  async function init(){
    if(!slug)throw new Error("missing_slug");const base=cfg.apiBase||"https://littleapi.online/api/v1",r=await fetch(base+"/apps/"+encodeURIComponent(slug)),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||data.error||"app_not_found");app=data;setup();applyLanguage();await load()
  }
  $("#language").onchange=e=>{localStorage.setItem("littleapi:language",e.target.value);applyLanguage()};$("#prev").onclick=()=>{if(state.page>0){state.page--;load()}};$("#next").onclick=()=>{if(state.hasMore){state.page++;load()}};$("#close").onclick=()=>$("#detail").close();$("#detail").onclick=e=>{if(e.target===$("#detail"))$("#detail").close()};
  $("#search").oninput=e=>{clearTimeout(timer);state.search=e.target.value.trim();timer=setTimeout(()=>{state.page=0;load()},280)};
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;$("#install").classList.remove("hidden")});$("#install").onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$("#install").classList.add("hidden")};
  init().catch(e=>{console.error(e);$("#results").innerHTML='<div class="error">'+esc(t("error"))+'</div>'});
})();
</script>
</body>
</html>
