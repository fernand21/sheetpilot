<body>
<header class="app-header">
<div class="identity"><img src="littleapi-icon.svg" alt=""><div><strong id="app-name">LittleApp</strong><small id="app-subtitle"></small></div></div>
<nav class="nav" id="nav"></nav>
<div class="header-tools"><button class="lang-toggle hidden" id="language-toggle" type="button" title="Change language"></button></div>
</header>
<main class="content">
<div class="toolbar hidden" id="toolbar"><label class="search"><span id="search-icon"></span><input id="search"></label><span class="count" id="count"></span></div>
<div id="view"><div class="empty">…</div></div>
<div class="pager hidden" id="pager"><button id="prev">←</button><span id="page-label"></span><button id="next">→</button></div>
</main>
<button class="fab hidden" id="fab" title="Add"><span id="fab-icon"></span></button>

<dialog id="detail-dialog"><div class="dialog-head"><h2 id="detail-title"></h2><button class="close" data-close="detail-dialog">×</button></div><div class="dialog-body" id="detail-body"></div></dialog>
<dialog id="edit-dialog"><div class="dialog-head"><h2 id="edit-title"></h2><button class="close" data-close="edit-dialog">×</button></div><div class="dialog-body"><form id="edit-form"><div class="form-grid" id="edit-fields"></div><div class="form-actions"><button type="button" class="button" data-close="edit-dialog" id="edit-cancel"></button><button class="button primary" id="edit-save"></button></div></form></div></dialog>

}

}
function rowsUrl(limitOverride){

async function loadRows(limitOverride){
state.loading=true;$("#view").innerHTML='<div class="empty">…</div>';
try{const r=await fetch(rowsUrl(limitOverride),{cache:"no-store"}),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||data.error||"load_error");state.rows=Array.isArray(data.data)?data.data:[];state.total=Number(data.total||0);state.hasMore=Boolean(data.has_more);renderActive(false)}catch(e){$("#view").innerHTML='<div class="error">'+esc(e.message||String(e))+'</div>'}finally{state.loading=false}
}
async function loadDashboard(){
state.loading=true;$("#toolbar").classList.add("hidden");$("#pager").classList.add("hidden");$("#fab").classList.add("hidden");$("#view").innerHTML='<div class="empty">…</div>';
try{const base=cfg.apiBase||"https://littleapi.online/api/v1",r=await fetch(base+"/apps/"+encodeURIComponent(app.slug)+"/dashboard",{cache:"no-store"}),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||data.error||"dashboard_error");state.dashboardData=data;state.total=Number(data.total||0);renderDashboard()}catch(e){$("#view").innerHTML='<div class="error">'+esc(e.message||String(e))+'</div>'}finally{state.loading=false}
}
function actionsFor(row,p){
const a=app.config?.actions||{},items=[];
if(p.detail!==false)items.push('<button class="action-icon" data-view-row="'+row.__row+'" title="'+esc(tr("details"))+'">'+icon("eye")+'</button>');
if(a.update===true)items.push('<button class="action-icon" data-edit-row="'+row.__row+'" title="'+esc(tr("edit"))+'">'+icon("edit")+'</button>');
if(a.delete===true)items.push('<button class="action-icon danger" data-delete-row="'+row.__row+'" title="'+esc(tr("delete"))+'">'+icon("trash")+'</button>');
return items.join("");
}
function bindRowActions(){
$$("[data-view-row]").forEach(b=>b.onclick=e=>{e.stopPropagation();showDetail(state.rows.find(r=>String(r.__row)===String(b.dataset.viewRow)))});
$$("[data-edit-row]").forEach(b=>b.onclick=e=>{e.stopPropagation();openEdit(state.rows.find(r=>String(r.__row)===String(b.dataset.editRow)))});
$$("[data-delete-row]").forEach(b=>b.onclick=e=>{e.stopPropagation();deleteRow(Number(b.dataset.deleteRow))});
}
function renderData(p){
const fs=fields(),rows=state.rows,view=p.view||"cards";$("#toolbar").classList.toggle("hidden",p.search===false);$("#count").textContent=tr("records").replace("{n}",String(state.total));$("#search").placeholder=tr("search");$("#search-icon").innerHTML=icon("search");
if(!rows.length){$("#view").innerHTML='<div class="empty">'+esc(tr("empty"))+'</div>'}
else if(view==="table"){
$("#view").innerHTML='<div class="table-wrap"><table><thead><tr>'+fs.map(f=>'<th>'+esc(f.label||f.name)+'</th>').join("")+'<th></th></tr></thead><tbody>'+rows.map(r=>'<tr>'+fs.map(f=>'<td>'+esc(r[f.name])+'</td>').join("")+'<td><div class="table-actions">'+actionsFor(r,p)+'</div></td></tr>').join("")+'</tbody></table></div>';
}else if(view==="list"){
$("#view").innerHTML='<div class="list">'+rows.map(r=>'<article class="record"><h3>'+esc(r[fs[0]?.name]||"Record")+'</h3><div class="list-meta">'+fs.slice(1,4).map(f=>'<span>'+esc(f.label||f.name)+': '+esc(r[f.name])+'</span>').join("")+'</div><div class="row-actions">'+actionsFor(r,p)+'</div></article>').join("")+'</div>';
}else{
$("#view").innerHTML='<div class="cards">'+rows.map(r=>'<article class="record"><h3>'+esc(r[fs[0]?.name]||"Record")+'</h3>'+fs.slice(1,6).map(f=>'<div class="kv"><span>'+esc(f.label||f.name)+'</span><b>'+esc(r[f.name])+'</b></div>').join("")+'<div class="row-actions">'+actionsFor(r,p)+'</div></article>').join("")+'</div>';
}
bindRowActions();const limit=Math.max(1,Number(app.config?.pageSize||25));$("#pager").classList.toggle("hidden",state.total<=limit&&state.page===0);$("#page-label").textContent=tr("page").replace("{n}",String(state.page+1));$("#prev").textContent="← "+tr("previous");$("#next").textContent=tr("next")+" →";$("#prev").disabled=state.page===0;$("#next").disabled=!state.hasMore;
$("#fab").classList.toggle("hidden",app.config?.actions?.create!==true);$("#fab-icon").innerHTML=icon("plus");$("#fab").title=tr("add");
}
function normalizeDateForInput(value){
const raw=String(value??"").trim();if(!raw)return"";
let m=raw.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
m=raw.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);if(m){let a=Number(m[1]),b=Number(m[2]),day=a,month=b;if(b>12&&a<=12){month=a;day=b}else if(a<=12&&b<=12&&appLang()==="en"){month=a;day=b}else{day=a;month=b}if(month>=1&&month<=12&&day>=1&&day<=31)return m[3]+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0")}
const d=new Date(raw);if(!Number.isNaN(d.getTime()))return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return"";
}
function inputFor(field,value="",prefix="new"){
const type=field.type==="number"?"number":field.type==="date"?"date":field.type==="email"?"email":"text";
const normalized=type==="date"?normalizeDateForInput(value):value;
return '<label><span>'+esc(field.label||field.name)+(field.required?" *":"")+'</span><input name="'+esc(field.name)+'" type="'+type+'" value="'+esc(normalized)+'" '+(field.required?"required":"")+'></label>';
}
function formMarkup(values={},prefix="new"){return editableFields().map(f=>inputFor(f,values[f.name]??"",prefix)).join("")}
function renderForm(){
$("#toolbar").classList.add("hidden");$("#pager").classList.add("hidden");$("#fab").classList.add("hidden");
if(app.config?.actions?.create!==true){$("#view").innerHTML='<div class="notice">'+esc(tr("actionDisabled"))+'</div>';return}
$("#view").innerHTML='<section class="form-page"><h2>'+esc(pageLabel(page()))+'</h2><p>'+esc(tr("formHelp"))+'</p><form id="create-form"><div class="form-grid">'+formMarkup()+'</div><div class="form-actions"><button class="button primary">'+icon("save")+' '+esc(tr("save"))+'</button></div><p id="form-status" class="count"></p></form></section>';
$("#create-form").onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries()),status=$("#form-status");status.textContent="…";try{await mutate("POST","",data);e.target.reset();status.textContent=tr("submitOk")}catch(err){status.textContent=err.message||String(err)}};
}
function numberValue(value){
const raw=String(value??"").trim();if(!raw)return NaN;
const clean=raw.replace(/\s/g,"").replace(/(?<=\d)[.,](?=\d{3}(?:\D|$))/g,"").replace(",",".");
return Number(clean);
}
function aggregate(values,aggregation){
if(aggregation==="count")return values.length;
const nums=values.map(numberValue).filter(Number.isFinite);if(!nums.length)return 0;
if(aggregation==="sum")return nums.reduce((a,b)=>a+b,0);
if(aggregation==="average")return nums.reduce((a,b)=>a+b,0)/nums.length;
if(aggregation==="min")return Math.min(...nums);
if(aggregation==="max")return Math.max(...nums);
return nums.length;
}
function metricValue(block){
const rows=state.rows,agg=block.aggregation||"count";
if(agg==="count")return block.valueField?rows.filter(r=>String(r[block.valueField]??"").trim()!=="").length:rows.length;
return aggregate(rows.map(r=>r[block.valueField]),agg);
}
function groupedValues(block){
const groups=new Map(),category=block.categoryField,value=block.valueField,agg=block.aggregation||"count";
for(const row of state.rows){const key=String(row[category]??"").trim()||"—";if(!groups.has(key))groups.set(key,[]);groups.get(key).push(value?row[value]:1)}
return Array.from(groups.entries()).map(([label,values])=>({label,value:agg==="count"?values.length:aggregate(values,agg)})).sort((a,b)=>b.value-a.value).slice(0,Math.max(1,Number(block.limit||7)));
}
function chartPalette(index){const colors=["#0b766e","#2f6fed","#6658e8","#e57c28","#d94f70","#47a36b","#b28b2d","#526b82","#a65aa1","#4f9fa8"];return colors[index%colors.length]}
function barChart(items){
const max=Math.max(1,...items.map(x=>Math.abs(Number(x.value)||0))),w=760,h=260,pad=34,gap=14,count=Math.max(1,items.length),bar=Math.max(18,(w-pad*2-gap*(count-1))/count);
const shapes=items.map((item,i)=>{const bh=(Math.abs(Number(item.value)||0)/max)*170,x=pad+i*(bar+gap),y=195-bh;return '<rect x="'+x+'" y="'+y+'" width="'+bar+'" height="'+bh+'" rx="6" fill="var(--accent)" opacity="'+Math.min(.95,.48+i*.06)+'"/><text x="'+(x+bar/2)+'" y="222" text-anchor="middle" fill="currentColor" opacity=".58" font-size="11">'+esc(String(item.label).slice(0,12))+'</text><text x="'+(x+bar/2)+'" y="'+Math.max(16,y-6)+'" text-anchor="middle" fill="currentColor" opacity=".72" font-size="10">'+esc(formatNumber(item.value))+'</text>'}).join("");
return '<svg class="chart-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line x1="'+pad+'" y1="195" x2="'+(w-pad)+'" y2="195" stroke="currentColor" opacity=".12"/>'+shapes+'</svg>';
}
function lineChart(items,area=false){
if(!items.length)return'<div class="empty">'+esc(tr("empty"))+'</div>';const w=760,h=260,pad=38,max=Math.max(1,...items.map(x=>Number(x.value)||0)),min=Math.min(0,...items.map(x=>Number(x.value)||0)),span=Math.max(1,max-min);
const pts=items.map((item,i)=>{const x=items.length===1?w/2:pad+i*((w-pad*2)/(items.length-1)),y=195-((Number(item.value)-min)/span)*155;return{x,y,item}});const points=pts.map(p=>p.x+","+p.y).join(" "),labels=pts.map(p=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="var(--accent)"/><text x="'+p.x+'" y="220" text-anchor="middle" fill="currentColor" opacity=".55" font-size="10">'+esc(String(p.item.label).slice(0,10))+'</text>').join("");const fill=area?'<polygon points="'+pad+',195 '+points+' '+(w-pad)+',195" fill="var(--accent)" opacity=".13"/>':"";
return '<svg class="chart-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+fill+'<polyline points="'+points+'" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+labels+'</svg>';
}
function pieChart(items,doughnut=false){
if(!items.length)return'<div class="empty">'+esc(tr("empty"))+'</div>';const total=Math.max(1,items.reduce((a,b)=>a+Math.max(0,Number(b.value)||0),0));let pos=0,parts=[];items.forEach((item,i)=>{const share=Math.max(0,Number(item.value)||0)/total*100,start=pos,end=pos+share;parts.push(chartPalette(i)+" "+start+"% "+end+"%");pos=end});const legend=items.map((item,i)=>'<span><i class="pie-dot" style="background:'+chartPalette(i)+'"></i>'+esc(item.label)+' · '+esc(formatNumber(item.value))+'</span>').join("");return '<div class="pie-layout"><div class="pie-shell '+(doughnut?"doughnut":"")+'" style="background:conic-gradient('+parts.join(",")+')"></div><div class="pie-legend">'+legend+'</div></div>';
}
function renderChart(block){
const items=groupedValues(block),type=block.chartType||"bar";if(type==="line")return lineChart(items,false);if(type==="area")return lineChart(items,true);if(type==="pie")return pieChart(items,false);if(type==="doughnut")return pieChart(items,true);return barChart(items)
}
function renderDashboard(){
$("#toolbar").classList.add("hidden");$("#pager").classList.add("hidden");$("#fab").classList.add("hidden");
const blocks=Array.isArray(state.dashboardData?.blocks)?state.dashboardData.blocks:[];
if(!blocks.length){$("#view").innerHTML='<div class="notice">'+esc(appLang()==="es"?"Este panel todavía no tiene bloques configurados.":"This dashboard has no configured blocks yet.")+'</div>';return}
$("#view").innerHTML='<section class="dash-grid">'+blocks.map(block=>{const title=appLang()==="es"?(block.titleEs||block.titleEn):(block.titleEn||block.titleEs);if(block.kind==="metric"){return'<article class="dash-block"><h3>'+esc(title||"Metric")+'</h3><div class="metric-value">'+esc(formatNumber(block.value))+'</div><div class="metric-sub">'+esc(block.aggregation||"count")+'</div></article>'}const items=Array.isArray(block.items)?block.items:[],type=block.chartType||"bar",chart=type==="line"?lineChart(items,false):type==="area"?lineChart(items,true):type==="pie"?pieChart(items,false):type==="doughnut"?pieChart(items,true):barChart(items);return'<article class="dash-block chart-wide"><h3>'+esc(title||"Chart")+'</h3>'+chart+'</article>'}).join("")+'</section>';
}
function formatNumber(n){return new Intl.NumberFormat(appLang(),{maximumFractionDigits:2}).format(Number(n||0))}
function renderChat(){
$("#toolbar").classList.add("hidden");$("#pager").classList.add("hidden");$("#fab").classList.add("hidden");
const c=app.config?.screens?.chat||{},fs=fields(),titleField=c.titleField||fs[0]?.name,messageField=c.messageField||fs[1]?.name||titleField,metaField=c.metaField||"",dateField=c.dateField||"",style=["support","compact"].includes(c.style)?c.style:"modern";
if(!state.rows.length){$("#view").innerHTML='<div class="empty">'+esc(tr("empty"))+'</div>';return}
$("#view").innerHTML='<section class="chat '+style+'">'+state.rows.map((r,i)=>'<article class="bubble"><strong>'+esc(r[titleField]||("Record "+(i+1)))+'</strong><p>'+esc(r[messageField]||"")+'</p>'+(metaField&&r[metaField]!==undefined?'<span class="chat-meta">'+esc(r[metaField])+'</span>':"")+(dateField&&r[dateField]!==undefined?'<span class="chat-date">'+esc(r[dateField])+'</span>':"")+'</article>').join("")+'</section>';
}
async function renderActive(load=true){
const p=page();renderNav();if(p.type==="form"){renderForm();return}if(p.type==="dashboard"){if(load){await loadDashboard();return}renderDashboard();return}if(load){state.page=0;await loadRows(p.type==="chat"?100:undefined);return}if(p.type==="chat")renderChat();else renderData(p)
}
function showDetail(row){if(!row)return;$("#detail-title").textContent=tr("details");$("#detail-body").innerHTML=fields().map(f=>'<div class="detail-row"><span>'+esc(f.label||f.name)+'</span><strong>'+esc(row[f.name])+'</strong></div>').join("");$("#detail-dialog").showModal()}
function openEdit(row){if(!row)return;editingRow=row;$("#edit-title").textContent=tr("edit");$("#edit-fields").innerHTML=formMarkup(row,"edit");$("#edit-cancel").textContent=tr("cancel");$("#edit-save").innerHTML=icon("save")+" "+esc(tr("save"));$("#edit-dialog").showModal()}
async function mutate(method,row,data){
const base=cfg.apiBase||"https://littleapi.online/api/v1",url=base+"/apps/"+encodeURIComponent(app.slug)+"/rows"+(row?"/"+encodeURIComponent(row):"");const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:method==="DELETE"?undefined:JSON.stringify({data})}),out=await r.json().catch(()=>({}));if(!r.ok)throw new Error(out.message||out.error||"request_failed");return out
}
async function deleteRow(row){if(!confirm(tr("deleteConfirm")))return;try{await mutate("DELETE",row);await loadRows(page().type==="dashboard"||page().type==="chat"?100:undefined)}catch(e){alert(e.message||String(e))}}
function applyLanguage(){document.documentElement.lang=appLang();if((app.config?.languageMode||"en")==="both")$("#language-toggle").innerHTML=icon("translate")+'<span>'+appLang().toUpperCase()+'</span>';renderNav();$("#search").placeholder=tr("search");if(!state.loading)renderActive(false)}
async function init(){
if(!slug)throw new Error("missing_slug");const base=cfg.apiBase||"https://littleapi.online/api/v1",r=await fetch(base+"/apps/"+encodeURIComponent(slug),{cache:"no-store"}),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||data.error||"app_not_found");app=data;activePageId=pages()[0].id;document.title=(app.config?.name||app.name)+" — LittleApp";applyChrome();renderNav();$("#search-icon").innerHTML=icon("search");await renderActive(true)
}
$("#search").oninput=e=>{clearTimeout(timer);state.search=e.target.value.trim();timer=setTimeout(()=>{state.page=0;loadRows()},250)};$("#prev").onclick=()=>{if(state.page>0){state.page--;loadRows()}};$("#next").onclick=()=>{if(state.hasMore){state.page++;loadRows()}};
$("#fab").onclick=()=>{const fp=pages().find(p=>p.type==="form");if(fp){activePageId=fp.id;renderActive()}else{openEdit({__row:null})}};
$("#edit-form").onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());try{if(editingRow?.__row)await mutate("PATCH",editingRow.__row,data);else await mutate("POST","",data);$("#edit-dialog").close();await loadRows()}catch(err){alert(err.message||String(err))}};
$$("[data-close]").forEach(b=>b.onclick=()=>$("#"+b.dataset.close).close());$("#language-toggle").onclick=()=>{const next=appLang()==="es"?"en":"es";localStorage.setItem("littleapp:language",next);applyLanguage()};
init().catch(e=>{$("#view").innerHTML='<div class="error">'+esc(e.message||String(e))+'</div>'});
})();
</script>
