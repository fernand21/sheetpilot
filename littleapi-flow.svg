<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
<title id="title">Google Sheet to LittleAPI to JSON</title><desc id="desc">Animated data flow illustration for LittleAPI</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102e27"/><stop offset="1" stop-color="#091b17"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22c7a8"/><stop offset=".55" stop-color="#d8ff7d"/><stop offset="1" stop-color="#8d72ff"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="720" height="470" rx="28" fill="url(#bg)"/>
<circle cx="358" cy="228" r="170" fill="#22c7a8" opacity=".035"/>
<circle cx="358" cy="228" r="120" fill="#8d72ff" opacity=".035"/>

<g filter="url(#shadow)">
  <rect x="42" y="100" width="210" height="250" rx="20" fill="#0f2a24" stroke="#2b5a4e"/>
  <path d="M42 120a20 20 0 0 1 20-20h170a20 20 0 0 1 20 20v38H42z" fill="#15392f"/>
  <circle cx="70" cy="129" r="9" fill="#d8ff7d"/>
  <text x="90" y="135" fill="#edf8f4" font-size="16" font-family="system-ui,sans-serif" font-weight="700">Google Sheet</text>
  <g fill="#0b211c" stroke="#315c51">
    <rect x="65" y="184" width="72" height="38" rx="7"/><rect x="146" y="184" width="82" height="38" rx="7"/>
    <rect x="65" y="232" width="72" height="38" rx="7"/><rect x="146" y="232" width="82" height="38" rx="7"/>
    <rect x="65" y="280" width="72" height="38" rx="7"/><rect x="146" y="280" width="82" height="38" rx="7"/>
  </g>
  <g fill="#a8c7bd" font-size="11" font-family="ui-monospace,monospace"><text x="76" y="207">Lucia</text><text x="160" y="207">pro</text><text x="76" y="255">Mateo</text><text x="160" y="255">free</text><text x="76" y="303">Sofia</text><text x="160" y="303">pro</text></g>
</g>

<path d="M266 227 C300 227 310 227 338 227" fill="none" stroke="#315e53" stroke-width="4" stroke-linecap="round"/>
<path d="M382 227 C410 227 420 227 454 227" fill="none" stroke="#315e53" stroke-width="4" stroke-linecap="round"/>
<path d="M266 227 C300 227 310 227 338 227 M382 227 C410 227 420 227 454 227" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 13">
  <animate attributeName="stroke-dashoffset" from="0" to="-92" dur="2.6s" repeatCount="indefinite"/>
</path>

<g filter="url(#shadow)">
  <circle cx="360" cy="227" r="42" fill="#123b31" stroke="#3a7566"/>
  <path d="M345 211h30v32h-30zM351 205h18M351 249h18" fill="none" stroke="#d8ff7d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="360" cy="227" r="52" fill="none" stroke="#22c7a8" opacity=".24"><animate attributeName="r" values="47;58;47" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;.04;.35" dur="3s" repeatCount="indefinite"/></circle>
</g>
<text x="330" y="292" fill="#9cc5ba" font-size="12" font-family="system-ui,sans-serif" font-weight="700">LittleAPI</text>

<g filter="url(#shadow)">
  <rect x="468" y="100" width="210" height="250" rx="20" fill="#071411" stroke="#2b5a4e"/>
  <path d="M468 120a20 20 0 0 1 20-20h170a20 20 0 0 1 20 20v38H468z" fill="#0e231e"/>
  <rect x="490" y="118" width="42" height="22" rx="6" fill="#d8ff7d"/>
  <text x="500" y="133" fill="#143026" font-size="11" font-family="ui-monospace,monospace" font-weight="800">GET</text>
  <text x="542" y="133" fill="#92b6ab" font-size="10" font-family="ui-monospace,monospace">/api/v1/data</text>
  <g font-size="12" font-family="ui-monospace,monospace"><text x="495" y="194" fill="#c9ddd7">[</text><text x="510" y="220" fill="#c9ddd7">{</text><text x="528" y="246" fill="#7fc8ff">"name"</text><text x="574" y="246" fill="#c9ddd7">:</text><text x="586" y="246" fill="#ffd08b">"Lucia"</text><text x="528" y="272" fill="#7fc8ff">"plan"</text><text x="568" y="272" fill="#c9ddd7">:</text><text x="580" y="272" fill="#d8ff7d">"pro"</text><text x="510" y="298" fill="#c9ddd7">}</text><text x="495" y="324" fill="#c9ddd7">]</text></g>
</g>

<g transform="translate(500 62)"><rect width="126" height="28" rx="14" fill="#14382f" stroke="#2f6557"/><circle cx="17" cy="14" r="4" fill="#22c7a8"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="29" y="18" fill="#cfe7df" font-size="11" font-family="system-ui,sans-serif" font-weight="700">Instant JSON</text></g>
<g transform="translate(80 372)"><rect width="164" height="30" rx="15" fill="#14382f" stroke="#2f6557"/><text x="14" y="20" fill="#cfe7df" font-size="11" font-family="system-ui,sans-serif" font-weight="700">No backend to deploy</text></g>
</svg>