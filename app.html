<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LittleAPI user workspace and API management dashboard." />
    <title>LittleAPI — App</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b766e'/%3E%3Cpath d='M17 18h30v28H17z' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M17 29h30M28 18v28' stroke='white' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app-enhancements.css" />
    <link rel="stylesheet" href="sheet-dialog.css?v=20260916-1" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18453708146"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18453708146');

  </head>
  <body class="app-page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="LittleAPI, inicio"><span class="brand-mark">↗</span><span>Little<span class="brand-accent">API</span></span></a>
      <nav aria-label="Navegación principal">
        <a href="docs/#quickstart" data-i18n="navHow">Cómo funciona</a>
        <a href="docs/#reads">API</a>
        <a href="docs/" data-i18n="navDocs">Documentación</a>
        <a href="pricing.html" data-i18n="navPricing">Precios</a>
        <a href="app.html" data-i18n="navApp">Aplicación</a>
      </nav>
      <div class="header-actions" id="header-actions">
        <label class="language-control" for="language-select"><span data-i18n="languageLabel">Idioma</span><select id="language-select" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option></select></label>
        <button class="button small" data-open-auth="google"><span data-i18n="authGoogle">Continuar con Google</span></button>
      </div>
    </header>

    <main id="inicio">
      <section class="app-login" id="app-login">
        <p class="eyebrow" data-i18n="dashboardEyebrow">TU ESPACIO</p>
        <h1 data-i18n="authTitle">Entra a tu cuenta</h1>
        <p class="lead" data-i18n="authIntro">Usa tu cuenta de Google para identificarte y conectar tus hojas.</p>
        <button class="button" data-open-auth="google"><span data-i18n="authGoogle">Continuar con Google</span> <span aria-hidden="true">→</span></button>
      </section>
      <div id="app-content"><p class="app-loading">Cargando tu espacio…</p></div>
    </main>

    <footer><span>© 2026 LittleAPI</span><span><a href="pricing.html" data-i18n="navPricing">Precios</a> · <a href="privacy.html" data-i18n="footerPrivacy">Privacidad</a> · <a href="terms.html" data-i18n="footerTerms">Términos</a></span></footer>

    <script>
      (async () => {
        const content = document.querySelector("#app-content");
        try {
          const response = await fetch("index.html");
          if (!response.ok) throw new Error("No se pudo cargar el espacio de trabajo.");
          const source = new DOMParser().parseFromString(await response.text(), "text/html");
          const dashboard = source.querySelector("#dashboard");
          if (!dashboard) throw new Error("No se encontró el panel de usuario.");
          content.innerHTML = dashboard.outerHTML;
          source.querySelectorAll("dialog").forEach(dialog => document.body.append(dialog.cloneNode(true)));
          const translationSource = [...source.scripts].find(script => script.textContent.includes("const translations ="));
          if (translationSource) {
            const translationScript = document.createElement("script");
            translationScript.textContent = translationSource.textContent;
            document.body.append(translationScript);
          }

          const loadScript = src => new Promise((resolve, reject) => {
            const existing = [...document.scripts].find(script => script.src === new URL(src, location.href).href);
            if (existing?.dataset.loaded === "true") return resolve();
            const script = existing || document.createElement("script");
            script.src = src;
            script.onload = () => { script.dataset.loaded = "true"; resolve(); };
            script.onerror = () => reject(new Error("No se pudo cargar " + src));
            if (!existing) document.body.append(script);
          });

          await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
          await loadScript("config.js");
          await loadScript("app.js?v=20260916-stable7");

          document.querySelector(".app-loading")?.remove();

          try {
            await loadScript("permissions-flow-strict.js?v=20260916-strict3");
          } catch (permissionError) {
            console.error("LittleAPI project/API authorization flow failed", permissionError);
          }

          try {
            await loadScript("project-actions-stable.js?v=20260916-actions1");
          } catch (projectActionError) {
            console.error("LittleAPI project card actions failed", projectActionError);
          }

          try {
            await loadScript("sheet-reference-preview.js?v=20260917-1");
          } catch (sheetPreviewError) {
            console.error("LittleAPI sheet reference preview failed", sheetPreviewError);
          }

          try {
            await loadScript("api-permissions.js?v=20260917-1");
          } catch (apiPermissionsError) {
            console.error("LittleAPI API permission controls failed", apiPermissionsError);
          }

          const NativeMutationObserver = window.MutationObserver;
          window.MutationObserver = class LittleAPIStableMutationObserver extends NativeMutationObserver {
            observe(target, options) {
              if (target === document.documentElement && options?.childList && options?.subtree) return;
              return super.observe(target, options);
            }
          };
          try {
            await loadScript("app-enhancements.js?v=20260916-stable7");
          } catch (enhancementError) {
            console.error("LittleAPI enhancements failed", enhancementError);
          } finally {
            window.MutationObserver = NativeMutationObserver;
          }

          const projectsGrid = document.querySelector("#projects-grid");
          if (projectsGrid) {
            let refreshQueued = false;
            new NativeMutationObserver(() => {
              if (refreshQueued) return;
              refreshQueued = true;
              requestAnimationFrame(() => {
                refreshQueued = false;
                window.dispatchEvent(new CustomEvent("littleapi:language-change", {
                  detail: localStorage.getItem("littleapi:language") || "en"
                }));
              });
            }).observe(projectsGrid, { childList: true });
          }
        } catch (error) {
          console.error("LittleAPI startup failed", error);
          if (content) content.innerHTML = '<p class="form-message error">' + String(error.message || error) + "</p>";
        }
      })();
    </script>
  </body>
</html>
