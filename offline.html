<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b766e" />
  <title>LittleAPI — Sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#071712;color:#effbf7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(560px,100%);padding:28px;border:1px solid #275247;border-radius:18px;background:#0b211b;box-shadow:0 20px 60px rgba(0,0,0,.28)}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#0b766e;color:#fff;font-weight:900;font-size:1.3rem}.eyebrow{margin:18px 0 6px;color:#d8ff7d;font-size:.72rem;font-weight:850;letter-spacing:.08em}.card h1{margin:0 0 10px;font-size:clamp(1.55rem,5vw,2.3rem)}.card p{margin:0;color:#9bbab1;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.button{appearance:none;border:0;border-radius:10px;padding:11px 15px;background:#d8ff7d;color:#10231d;font:inherit;font-weight:850;cursor:pointer}.link{display:inline-flex;align-items:center;padding:10px 0;color:#8de5d0;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <span class="mark">↗</span>
    <p class="eyebrow">LITTLEAPI</p>
    <h1>Estás sin conexión.</h1>
    <p>El panel puede conservar parte de su interfaz, pero las APIs, Google Sheets, Google Drive y Supabase necesitan conexión para consultar o modificar datos.</p>
    <div class="actions"><button class="button" type="button" onclick="location.reload()">Reintentar</button><a class="link" href="/app.html">Volver al panel</a></div>
  </main>
</body>
</html>
