<script>
(()=>{try{
  const slug=new URLSearchParams(location.search).get("app")||"";
  if(slug){
    const manifest=document.createElement("link");
    manifest.rel="manifest";
    manifest.href="https://littleapi.online/api/v1/apps/"+encodeURIComponent(slug)+"/manifest.webmanifest";
    document.head.appendChild(manifest);
  }
  const cached=JSON.parse(localStorage.getItem("littleapp:boot:"+slug)||"null");
  if(cached){
    const dark=cached.theme==="dark"||(cached.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.bootTheme=dark?"dark":"light";
    if(cached.accent)document.documentElement.style.setProperty("--boot-accent",cached.accent);
    window.__LITTLEAPP_BOOT__=cached;
  }else{
    document.documentElement.dataset.bootTheme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  }
}catch(_){document.documentElement.dataset.bootTheme="light"}
})();
</script>

.dash-grid{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:18px;
  align-items:stretch;
}
.dash-block{
  grid-column:span 4;
  min-width:0;
  border:1px solid color-mix(in srgb,var(--line) 82%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 98%,white 2%),var(--panel));
  border-radius:20px;
  padding:20px;
  box-shadow:0 14px 38px rgba(14,55,47,.07);
  overflow:hidden;
}
.dash-block.chart-wide{grid-column:span 8}
.dash-block h3{
  margin:0 0 16px;
  font-size:1rem;
  font-weight:850;
  letter-spacing:-.01em;
  color:var(--text);
}
.metric-card{
  position:relative;
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:22px 22px 20px;
}
.metric-card:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:5px;
  background:var(--accent);
  border-radius:20px 0 0 20px;
}
.metric-card h3{

  font-size:.78rem;

  letter-spacing:.06em;
}

}

  padding:5px 9px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:.68rem;
  font-weight:850;
  text-transform:capitalize;
}
.chart-card,.dash-block.chart-wide{
  padding:20px 20px 18px;
}
.chart-svg{
  width:100%;
  height:300px;
  display:block;
  color:var(--text);
}
.chart-svg text{
  fill:var(--text)!important;

}

  flex:0 0 9px;
}

  display:grid;
  grid-template-columns:minmax(180px,260px) 1fr;
  align-items:center;
  gap:24px;
}

  }
  .metric-card{

  }

  }

  }

  }

function sameLocalTarget(op,row){
 if(row?.__local_id)return op.local_id===row.__local_id;
 return Boolean(row?.__fingerprint)&&op.fingerprint===row.__fingerprint;
}
function updateLocalBuckets(sheet,callback){
 for(const bucket of Object.values(state.snapshot?.pages||{})){if(bucket?.sheet===sheet){bucket.rows=Array.isArray(bucket.rows)?bucket.rows:[];callback(bucket)}}
 if(state.snapshot?.dashboard?.sheet===sheet){const bucket=state.snapshot.dashboard;bucket.rows=Array.isArray(bucket.rows)?bucket.rows:[];callback(bucket)}
}
function queueLocalMutation(method,rowKeyValue,data){
 if(!state.snapshot)throw new Error("local_snapshot_missing");
 state.snapshot.pending=Array.isArray(state.snapshot.pending)?state.snapshot.pending:[];
 const p=page(),source=state.snapshot.pages?.[p.id],sheet=source?.sheet||p.sheet||app.sheet||"",queue=state.snapshot.pending;
 const row=state.rows.find(r=>rowKey(r)===String(rowKeyValue));
 if(method==="POST"){
   const localId=crypto.randomUUID(),tempRow="local:"+localId,op={id:crypto.randomUUID(),type:"create",page:p.id,sheet,local_id:localId,data:{...(data||{})},created_at:new Date().toISOString()};
   queue.push(op);
   updateLocalBuckets(sheet,bucket=>{const obj={__row:tempRow,__local_id:localId,__pending:true};for(const h of bucket.headers||[])obj[h]=data?.[h]??"";bucket.rows.push(obj)});
   return op;
 }
 if(!row)throw new Error("row_not_found");
 const isLocal=Boolean(row.__local_id);
 if(method==="PATCH"){
   if(isLocal){
     const createOp=queue.find(op=>op.type==="create"&&op.local_id===row.__local_id);if(createOp)createOp.data={...(createOp.data||{}),...(data||{})};
   }else{
     let updateOp=queue.find(op=>op.type==="update"&&sameLocalTarget(op,row));
     if(updateOp)updateOp.data={...(updateOp.data||{}),...(data||{})};
     else queue.push({id:crypto.randomUUID(),type:"update",page:p.id,sheet,row:Number(row.__row)||0,fingerprint:row.__fingerprint||"",data:{...(data||{})},created_at:new Date().toISOString()});
   }
   updateLocalBuckets(sheet,bucket=>{const item=bucket.rows.find(r=>rowKey(r)===rowKey(row));if(item){for(const [k,v] of Object.entries(data||{}))if((bucket.headers||[]).includes(k))item[k]=v;item.__pending=true}});
 }else if(method==="DELETE"){
   if(isLocal){
     state.snapshot.pending=queue.filter(op=>!(op.type==="create"&&op.local_id===row.__local_id));
   }else{
     state.snapshot.pending=queue.filter(op=>!((op.type==="update"||op.type==="delete")&&sameLocalTarget(op,row)));
     state.snapshot.pending.push({id:crypto.randomUUID(),type:"delete",page:p.id,sheet,row:Number(row.__row)||0,fingerprint:row.__fingerprint||"",data:{},created_at:new Date().toISOString()});
   }
   updateLocalBuckets(sheet,bucket=>{bucket.rows=bucket.rows.filter(r=>rowKey(r)!==rowKey(row))});
 }
 return true;
}
async function mutate(method,row,data){
 queueLocalMutation(method,row,data);
 await localPut(state.snapshot);
 updateSyncUi();
 showToast(tr("savedLocal"));
 return {success:true,local:true}
}
async function deleteRow(row){if(!confirm(tr("deleteConfirm")))return;try{await mutate("DELETE",row,{});state.page=0;await renderActive(true)}catch(e){showToast(e.message||String(e),"error")}}
function applyLanguage(){document.documentElement.lang=appLang();if((app.config?.languageMode||"en")==="both")$("#language-toggle").innerHTML=icon("translate")+'<span>'+appLang().toUpperCase()+'</span>';renderNav();$("#search").placeholder=tr("search");if(!state.loading)renderActive(false)}
async function init(){
const cached=window.__LITTLEAPP_BOOT__;if(cached?.name)$("#loader-name").textContent=cached.name;
if(!slug)throw new Error("missing_slug");const base=cfg.apiBase||"https://littleapi.online/api/v1",r=await fetch(base+"/apps/"+encodeURIComponent(slug),{cache:"no-store"}),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||data.error||"app_not_found");app=data;state.snapshot=await localGet();if(state.snapshot&&!Array.isArray(state.snapshot.pending))state.snapshot.pending=[];$("#loader-name").textContent=app.config?.name||app.name||"LittleApp";activePageId=pages()[0].id;document.title=(app.config?.name||app.name)+" — LittleApp";applyChrome();renderNav();$("#search-icon").innerHTML=icon("search");updateSyncUi();updateInstallUi();if(!state.snapshot)await syncNow(false);await renderActive(true);requestAnimationFrame(()=>document.body.classList.add("app-ready"))
}
function bindRuntimeEvents(){
const search=$("#search");if(search)search.oninput=e=>{clearTimeout(timer);state.search=e.target.value.trim();timer=setTimeout(()=>{state.page=0;void loadRows()},250)};
const prev=$("#prev");if(prev)prev.onclick=()=>{if(state.page>0){state.page--;void loadRows()}};
const next=$("#next");if(next)next.onclick=()=>{if(state.hasMore){state.page++;void loadRows()}};const pageInput=$("#page-input");if(pageInput){const jump=()=>{const limit=Math.max(1,Number(app.config?.pageSize||25)),totalPages=Math.max(1,Math.ceil(state.total/limit)),wanted=Math.max(1,Math.min(totalPages,Number(pageInput.value)||1));if(wanted!==state.page+1){state.page=wanted-1;void loadRows()}else pageInput.value=String(wanted)};pageInput.onchange=jump;pageInput.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();jump()}}};
const fab=$("#fab");if(fab)fab.onclick=()=>{const fp=pages().find(p=>p.type==="form");if(fp){activePageId=fp.id;void renderActive()}else{openEdit({__row:null})}};
const editForm=$("#edit-form");if(editForm)editForm.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());try{if(editingRow?.__row||editingRow?.__local_id)await mutate("PATCH",rowKey(editingRow),data);else await mutate("POST","",data);$("#edit-dialog")?.close();await loadRows()}catch(err){alert(err.message||String(err))}};
$$("[data-close]").forEach(b=>{b.onclick=()=>$("#"+b.dataset.close)?.close()});
const syncButton=$("#sync-button");if(syncButton)syncButton.onclick=()=>void syncNow(true);
const installButton=$("#install-button");if(installButton)installButton.onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice.catch(()=>null);deferredInstallPrompt=null;updateInstallUi()};
const languageToggle=$("#language-toggle");if(languageToggle)languageToggle.onclick=()=>{const nextLang=appLang()==="es"?"en":"es";localStorage.setItem("littleapp:language",nextLang);applyLanguage()};window.addEventListener("resize",applyResponsiveNavigation);window.addEventListener("orientationchange",()=>setTimeout(applyResponsiveNavigation,120));if(window.visualViewport)window.visualViewport.addEventListener("resize",applyResponsiveNavigation);
}
async function boot(){
try{
  await init();
  bindRuntimeEvents();
}catch(e){
  console.error("LittleApp startup failed",e);
  const view=$("#view");if(view)view.innerHTML='<div class="error"><strong>LittleApp startup error</strong><br>'+esc(e?.message||String(e))+'</div>';const ls=$("#loader-status");if(ls)ls.textContent=e?.message||String(e);document.body.classList.add("app-ready");
}
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js?v=20260919-25").catch(()=>{})}
void boot();
})();
