<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex,nofollow" />
  <title>LittleAPI Widget</title>
  <style>
    :root{--bg:#071712;--panel:#0b211b;--line:#275247;--text:#effbf7;--muted:#9bbab1;--accent:#d8ff7d;--accent2:#53c8ad;--danger:#ffb4a8;--shadow:0 18px 50px rgba(0,0,0,.22)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body[data-theme="light"]{--bg:#f5faf8;--panel:#fff;--line:#d9e8e3;--text:#123027;--muted:#637d75;--accent:#0b766e;--accent2:#0b766e;--danger:#a4392f;--shadow:0 16px 40px rgba(25,72,61,.10)}
    @media(prefers-color-scheme:light){body[data-theme="auto"]{--bg:#f5faf8;--panel:#fff;--line:#d9e8e3;--text:#123027;--muted:#637d75;--accent:#0b766e;--accent2:#0b766e;--danger:#a4392f;--shadow:0 16px 40px rgba(25,72,61,.10)}}
    .widget{min-height:100vh;padding:14px}.shell{width:100%;max-width:1200px;margin:0 auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
    .head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent2);color:#fff}.mark svg{width:19px;height:19px;display:block}.title-wrap{min-width:0}.title{margin:0;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin:2px 0 0;color:var(--muted);font-size:.72rem}.search{width:min(260px,42vw);padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--text);outline:none}.search:focus{border-color:var(--accent2)}
    .state{padding:34px 18px;text-align:center;color:var(--muted)}.state strong{display:block;margin-bottom:7px;color:var(--text)}.state.error strong{color:var(--danger)}
    .table-wrap{width:100%;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:.8rem}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table th{position:sticky;top:0;background:var(--panel);z-index:1;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}.table tbody tr:last-child td{border-bottom:0}.table tbody tr:hover{background:color-mix(in srgb,var(--accent2) 8%,transparent)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;padding:12px}.card{padding:12px;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--panel) 92%,var(--accent2) 8%)}.field{display:grid;grid-template-columns:minmax(70px,.45fr) minmax(0,1fr);gap:9px;padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 72%,transparent)}.field:last-child{border-bottom:0}.field b{color:var(--muted);font-size:.68rem;overflow:hidden;text-overflow:ellipsis}.field span{font-size:.76rem;overflow-wrap:anywhere}
    .foot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 13px;border-top:1px solid var(--line);color:var(--muted);font-size:.68rem}.foot-right{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.foot a{color:var(--accent);text-decoration:none;font-weight:800}.pagination{display:flex;align-items:center;gap:7px}.page-button{appearance:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:transparent;color:var(--text);font:inherit;font-weight:800;cursor:pointer}.page-button:hover:not(:disabled){border-color:var(--accent2)}.page-button:disabled{opacity:.4;cursor:not-allowed}.page-jump{display:flex;align-items:center;gap:5px;white-space:nowrap}.page-input{width:56px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--text);font:inherit;font-weight:800;text-align:center;outline:none}.page-input:focus{border-color:var(--accent2)}.page-input:disabled{opacity:.5}.hidden{display:none!important}
    @media(max-width:620px){.head{align-items:stretch;flex-direction:column}.search{width:100%}.widget{padding:8px}.shell{border-radius:12px}.table th,.table td{padding:9px 10px}.cards{grid-template-columns:1fr}.foot{align-items:stretch;flex-direction:column}.foot-right{justify-content:space-between}.pagination{justify-content:flex-start;flex-wrap:wrap}}
  </style>
</head>
<body data-theme="auto">
  <main class="widget">
    <section class="shell" aria-live="polite">
      <header class="head">
        <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3.5" y="4.5" width="17" height="15" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9h17M3.5 14h17M9 4.5v15M15 4.5v15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><div class="title-wrap"><h1 class="title" id="widget-title">LittleAPI</h1><p class="sub" id="widget-subtitle">Datos en vivo</p></div></div>
        <input class="search hidden" id="widget-search" type="search" autocomplete="off" placeholder="Buscar en toda la hoja…" aria-label="Buscar en toda la hoja" />
      </header>
      <div class="state" id="widget-state"><strong>Cargando datos…</strong><span>Conectando con LittleAPI.</span></div>
      <div class="table-wrap hidden" id="table-view"><table class="table"><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
      <div class="cards hidden" id="card-view"></div>
      <footer class="foot hidden" id="widget-foot">
        <span id="widget-count"></span>
        <div class="foot-right">
          <nav class="pagination" id="widget-pagination" aria-label="Paginación">
            <button class="page-button" type="button" id="page-prev">Anterior</button>
            <label class="page-jump" for="page-input"><span id="page-word">Página</span><input class="page-input" id="page-input" type="number" min="1" step="1" value="1" inputmode="numeric"><span id="page-total"></span></label>
            <button class="page-button" type="button" id="page-next">Siguiente</button>
          </nav>
          <a href="https://littleapi.online" target="_blank" rel="noopener noreferrer">Powered by LittleAPI ↗</a>
        </div>
      </footer>
    </section>
  </main>
  <script>
  (() => {
    const p = new URLSearchParams(location.search);
    const apiId = (p.get('api') || '').trim();
    const pageSize = Math.max(1, Math.min(100, Number(p.get('page_size') || p.get('limit') || 25) || 25));
    const searchBatchSize = 200;
    const view = p.get('view') === 'cards' ? 'cards' : 'table';
    const theme = ['light','dark','auto'].includes(p.get('theme')) ? p.get('theme') : 'auto';
    const language = p.get('lang') === 'en' ? 'en' : (p.get('lang') === 'es' ? 'es' : ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en'));
    const customTitle = (p.get('title') || '').trim();
    const sheet = (p.get('sheet') || '').trim();
    const columns = p.getAll('col').map(value => String(value || '').trim().toUpperCase()).filter(value => /^[A-Z]+$/.test(value));
    const countColumns = p.getAll('count_col').map(value => String(value || '').trim().toUpperCase()).filter(value => /^[A-Z]+$/.test(value));
    const labels = language === 'es'
      ? { live:'Datos en vivo', loading:'Cargando datos…', connecting:'Conectando con LittleAPI.', search:'Buscar en toda la hoja…', empty:'No hay filas para mostrar.', rows:n => n === 1 ? '1 fila en esta página' : `${n} filas en esta página`, results:n => n === 1 ? '1 resultado en esta página' : `${n} resultados en esta página`, pageWord:'Página', of:total => total ? `de ${total}` : '', previous:'Anterior', next:'Siguiente', error:'No se pudo cargar el widget', public:'Este widget sólo puede mostrar APIs con lectura pública habilitada.' }
      : { live:'Live data', loading:'Loading data…', connecting:'Connecting to LittleAPI.', search:'Search the entire sheet…', empty:'No rows to display.', rows:n => n === 1 ? '1 row on this page' : `${n} rows on this page`, results:n => n === 1 ? '1 result on this page' : `${n} results on this page`, pageWord:'Page', of:total => total ? `of ${total}` : '', previous:'Previous', next:'Next', error:'The widget could not be loaded', public:'This widget can only display APIs with public read enabled.' };

    document.documentElement.lang = language;
    document.body.dataset.theme = theme;
    const state = document.querySelector('#widget-state');
    const search = document.querySelector('#widget-search');
    const title = document.querySelector('#widget-title');
    const subtitle = document.querySelector('#widget-subtitle');
    const tableView = document.querySelector('#table-view');
    const cardView = document.querySelector('#card-view');
    const foot = document.querySelector('#widget-foot');
    const count = document.querySelector('#widget-count');
    const prev = document.querySelector('#page-prev');
    const next = document.querySelector('#page-next');
    const pageWord = document.querySelector('#page-word');
    const pageInput = document.querySelector('#page-input');
    const pageTotal = document.querySelector('#page-total');
    search.placeholder = labels.search;
    search.setAttribute('aria-label', labels.search);
    prev.textContent = labels.previous;
    next.textContent = labels.next;
    pageWord.textContent = labels.pageWord;
    subtitle.textContent = sheet ? `${labels.live} · ${sheet}` : labels.live;
    if (customTitle) title.textContent = customTitle;

    let rows = [];
    let currentPage = 1;
    let hasNext = false;
    let loading = false;
    let loadToken = 0;
    let searchTimer = 0;
    let sheetTotalRows = null;
    let sheetTotalPages = null;
    let totalCountPromise = null;
    let searchState = { term:'', matches:[], scanOffset:0, ended:false };
    const text = value => value == null ? '' : (typeof value === 'object' ? JSON.stringify(value) : String(value));
    const selection = columns.length ? columns.join(', ') : '*';

    function fail(message) {
      state.className = 'state error';
      state.replaceChildren();
      const strong = document.createElement('strong'); strong.textContent = labels.error;
      const span = document.createElement('span'); span.textContent = message || labels.public;
      state.append(strong, span);
      tableView.classList.add('hidden'); cardView.classList.add('hidden'); foot.classList.add('hidden');
    }

    function currentTotalPages() {
      const term = search.value.trim();
      if (!term) return sheetTotalPages;
      return searchState.ended ? Math.max(1, Math.ceil(searchState.matches.length / pageSize)) : null;
    }

    function updatePagination() {
      const totalPages = currentTotalPages();
      prev.disabled = loading || currentPage <= 1;
      next.disabled = loading || (totalPages ? currentPage >= totalPages : !hasNext);
      pageInput.disabled = loading;
      pageInput.min = '1';
      if (totalPages) pageInput.max = String(totalPages);
      else pageInput.removeAttribute('max');
      if (document.activeElement !== pageInput) pageInput.value = String(currentPage);
      pageTotal.textContent = labels.of(totalPages);
    }

    function render() {
      state.classList.add('hidden');
      search.classList.remove('hidden');
      foot.classList.remove('hidden');
      const term = search.value.trim();
      count.textContent = term ? labels.results(rows.length) : labels.rows(rows.length);
      updatePagination();
      if (!rows.length) {
        tableView.classList.add('hidden'); cardView.classList.add('hidden');
        state.className = 'state'; state.replaceChildren();
        const strong = document.createElement('strong'); strong.textContent = labels.empty;
        state.append(strong); return;
      }
      state.classList.add('hidden');
      const keys = Array.from(rows.reduce((set,row) => { Object.keys(row || {}).forEach(k => set.add(k)); return set; }, new Set()));
      if (view === 'cards') {
        tableView.classList.add('hidden'); cardView.classList.remove('hidden'); cardView.replaceChildren();
        rows.forEach(row => {
          const article = document.createElement('article'); article.className = 'card';
          keys.forEach(key => {
            const field = document.createElement('div'); field.className = 'field';
            const b = document.createElement('b'); b.textContent = key;
            const span = document.createElement('span'); span.textContent = text(row?.[key]);
            field.append(b, span); article.append(field);
          });
          cardView.append(article);
        });
      } else {
        cardView.classList.add('hidden'); tableView.classList.remove('hidden');
        const head = document.querySelector('#table-head'); const body = document.querySelector('#table-body');
        head.replaceChildren(); body.replaceChildren();
        const trh = document.createElement('tr'); keys.forEach(key => { const th = document.createElement('th'); th.textContent = key; trh.append(th); }); head.append(trh);
        rows.forEach(row => { const tr = document.createElement('tr'); keys.forEach(key => { const td = document.createElement('td'); td.textContent = text(row?.[key]); td.title = text(row?.[key]); tr.append(td); }); body.append(tr); });
      }
    }

    function setLoading() {
      state.className = 'state';
      state.replaceChildren();
      const strong = document.createElement('strong'); strong.textContent = labels.loading;
      const span = document.createElement('span'); span.textContent = labels.connecting;
      state.append(strong, span);
      state.classList.remove('hidden');
      tableView.classList.add('hidden');
      cardView.classList.add('hidden');
    }

    async function fetchQuery(query) {
      const params = new URLSearchParams({ columns: 'letters', headers: '1', q: query });
      if (sheet) params.set('sheet', sheet);
      const queryUrl = `/api/v1/${encodeURIComponent(apiId)}/query?${params.toString()}`;
      const response = await fetch(queryUrl, { headers: { Accept:'application/json' }, credentials:'omit' });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 401 || response.status === 403) throw new Error(labels.public);
        throw new Error(body?.message || body?.error || `HTTP ${response.status}`);
      }
      if (!customTitle && body?.meta?.name) title.textContent = body.meta.name;
      if (!sheet && body?.meta?.sheet) subtitle.textContent = `${labels.live} · ${body.meta.sheet}`;
      return Array.isArray(body) ? body : (Array.isArray(body?.data) ? body.data : []);
    }

    async function queryRows(query, token) {
      const data = await fetchQuery(query);
      if (token !== loadToken) return null;
      return data;
    }

    async function ensureSheetTotalPages() {
      if (sheetTotalPages !== null) return sheetTotalPages;
      if (totalCountPromise) return totalCountPromise;
      totalCountPromise = (async () => {
        try {
          const candidates = (countColumns.length ? countColumns : (columns.length ? columns : ['A'])).slice(0, 40);
          const query = `select ${candidates.map(column => `count(${column})`).join(', ')}`;
          const data = await fetchQuery(query);
          const first = data?.[0] || {};
          const counts = Object.values(first).map(value => Number(value)).filter(value => Number.isFinite(value));
          sheetTotalRows = counts.length ? Math.max(...counts) : 0;
          sheetTotalPages = Math.max(1, Math.ceil(sheetTotalRows / pageSize));
          updatePagination();
          return sheetTotalPages;
        } catch (_) {
          return null;
        } finally {
          totalCountPromise = null;
        }
      })();
      return totalCountPromise;
    }

    function resetSearch(term) {
      searchState = { term, matches:[], scanOffset:0, ended:false };
    }

    async function ensureSearchMatches(target, token) {
      const needle = searchState.term.toLowerCase();
      while (searchState.matches.length < target && !searchState.ended) {
        const query = `select ${selection} limit ${searchBatchSize} offset ${searchState.scanOffset}`;
        const fetched = await queryRows(query, token);
        if (fetched === null || token !== loadToken) return false;
        for (const row of fetched) {
          const found = Object.values(row || {}).some(value => text(value).toLowerCase().includes(needle));
          if (found) searchState.matches.push(row);
        }
        searchState.scanOffset += fetched.length;
        if (fetched.length < searchBatchSize) searchState.ended = true;
      }
      return token === loadToken;
    }

    async function loadPage(page) {
      const token = ++loadToken;
      loading = true;
      const totalPages = currentTotalPages();
      const requested = Math.max(1, Math.floor(Number(page) || 1));
      currentPage = totalPages ? Math.min(requested, totalPages) : requested;
      updatePagination();
      setLoading();
      const term = search.value.trim();

      try {
        if (term) {
          if (searchState.term !== term) resetSearch(term);
          const needed = currentPage * pageSize + 1;
          if (!(await ensureSearchMatches(needed, token))) return;
          const start = (currentPage - 1) * pageSize;
          rows = searchState.matches.slice(start, start + pageSize);
          hasNext = searchState.matches.length > start + pageSize;
          if (!rows.length && currentPage > 1 && searchState.ended) {
            const lastPage = Math.max(1, Math.ceil(searchState.matches.length / pageSize));
            loading = false;
            return loadPage(lastPage);
          }
        } else {
          resetSearch('');
          void ensureSheetTotalPages();
          const offset = (currentPage - 1) * pageSize;
          const query = `select ${selection} limit ${pageSize + 1} offset ${offset}`;
          const fetched = await queryRows(query, token);
          if (fetched === null || token !== loadToken) return;
          hasNext = fetched.length > pageSize;
          rows = fetched.slice(0, pageSize);
          if (!rows.length && currentPage > 1) {
            const knownPages = await ensureSheetTotalPages();
            loading = false;
            return loadPage(knownPages || Math.max(1, currentPage - 1));
          }
        }
        if (token === loadToken) render();
      } catch (error) {
        if (token === loadToken) fail(error?.message || String(error));
      } finally {
        if (token === loadToken) {
          loading = false;
          updatePagination();
        }
      }
    }

    function jumpToRequestedPage() {
      if (loading) return;
      let requested = Math.max(1, Math.floor(Number(pageInput.value) || currentPage));
      const totalPages = currentTotalPages();
      if (totalPages) requested = Math.min(requested, totalPages);
      pageInput.value = String(requested);
      if (requested !== currentPage) void loadPage(requested);
    }

    search.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        resetSearch(search.value.trim());
        void loadPage(1);
      }, 320);
    });
    prev.addEventListener('click', () => void loadPage(currentPage - 1));
    next.addEventListener('click', () => void loadPage(currentPage + 1));
    pageInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        jumpToRequestedPage();
        pageInput.blur();
      }
    });
    pageInput.addEventListener('change', jumpToRequestedPage);
    pageInput.addEventListener('blur', () => { if (!loading) pageInput.value = String(currentPage); });
    if (!apiId || !/^[A-Za-z0-9_-]{8,120}$/.test(apiId)) return fail(language === 'es' ? 'Falta un API ID válido.' : 'A valid API ID is required.');
    void loadPage(1);
  })();
  </script>
</body>
</html>
